name: Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Java 17 + dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk git zip unzip python3-pip \
          autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
          libncursesw5-dev cmake libffi-dev libssl-dev wget

    - name: Install Android SDK
      run: |
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        export PATH=$JAVA_HOME/bin:$PATH
        mkdir -p ~/android-sdk
        cd ~/android-sdk
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
        export ANDROID_SDK_ROOT=~/android-sdk
        export ANDROID_HOME=~/android-sdk
        export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "PATH=$PATH" >> $GITHUB_ENV
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"

    - name: Install p4a
      run: |
        pip install python-for-android cython

    - name: Build APK
      run: |
        export ANDROID_SDK_ROOT=~/android-sdk
        export ANDROID_HOME=~/android-sdk
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        export PATH=$JAVA_HOME/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
        p4a apk \
          --private android \
          --package=com.yourname.chat \
          --name="极简聊天" \
          --version=1.0 \
          --bootstrap=sdl2 \
          --requirements=python3==3.10.0,kivy==2.3.0 \
          --permission=INTERNET \
          --permission=ACCESS_NETWORK_STATE \
          --permission=ACCESS_WIFI_STATE \
          --arch=arm64-v8a \
          --arch=armeabi-v7a \
          --android-api=30 \
          --sdk-dir=~/android-sdk \
          --dist-name=chat \
          --debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: chat-app-apk
        path: dist/*.apk
