name: Build APK with Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build APK with buildozer in Docker
      run: |
        docker run --rm \
          -v $PWD:/app \
          -w /app \
          andrewgodwin/buildozer \
          buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: chat-app-apk
        path: bin/*.apk
